server {
    listen 8080;
    default_type application/json;

    location ~ "^/api/cards/999903[0-9]{10}(/rollback)?$" {
        return 503 '{"error":"Card service unavailable"}';
    }

    location ~ "^/api/cards/999900[0-9]{10}$" {
        return 200 '{"status":null}';
    }

    location ~ "^/api/cards/(99990[12456][0-9]{10})$" {
        return 200 '{"status":"ACTIVE","pan":"$1","expiryDate":"2099-12","availableBalance":200000,"dailyLimit":150000,"monthlyLimit":180000}';
    }

    location ~ "^/api/cards/999901[0-9]{10}/reserve$" {
        return 402 '{"error":"Insufficient funds on reserve"}';
    }

    location ~ "^/api/cards/999904[0-9]{10}/reserve$" {
        return 404 '{"error":"Card disappeared before reservation"}';
    }

    location ~ "^/api/cards/999905[0-9]{10}/reserve$" {
        return 503 '{"error":"Reservation service unavailable"}';
    }

    location ~ "^/api/cards/999906[0-9]{10}/reserve$" {
        return 500 '{"error":"Reservation service failed"}';
    }

    location ~ "^/api/cards/[0-9]{16}/reserve$" {
        return 409 '{"error":"Reservation conflict"}';
    }

    location ~ "^/api/cards/[0-9]{16}/rollback$" {
        return 422 '{"error":"Rollback rejected"}';
    }

    location / {
        proxy_pass http://card-management:8080;
    }
}

server {
    listen 8081;
    default_type application/json;

    location = /api/cards {
        # Terminal mixed scenarios request 80% of the configured 10,000-card pool.
        if ($arg_limit = 8000) { return 444; }
        # Merchant uses its requested transaction count as the card query limit.
        if ($arg_limit = 2) { return 200 '{"cards":null,"total":1}'; }
        if ($arg_limit = 3) { return 200 '{"cards":[],"total":0}'; }
        return 503 '{"error":"SERVICE_UNAVAILABLE","message":"Card fixture unavailable","serviceName":"card-management","retryAfterMs":"0"}';
    }

    location = /terminal-errors/api/cards {
        if ($arg_limit = 8000) { return 404 '{"error":"Card fixture route unavailable"}'; }
        return 200 '{"cards":null,"total":1}';
    }

    location = /v3/api-docs {
        return 200 '{broken';
    }
}
